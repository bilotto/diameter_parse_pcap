[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diameter-parse-pcap"
version = "1.0.0"
description = "A Python library for parsing and analyzing Diameter protocol messages from network packet captures (PCAP files)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fabio Bilotto", email = "fabio.bilotto@amdocs.com"}
]
maintainers = [
    {name = "Fabio Bilotto", email = "fabio.bilotto@amdocs.com"}
]
keywords = ["diameter", "pcap", "telecom", "3gpp", "gx", "rx", "sy", "pcrf", "pcc", "policy", "charging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "diameter>=1.0.0",
    "diameter-telecom>=1.0.0",
    "pyshark>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/bilotto/diameter_parse_pcap"
Repository = "https://github.com/bilotto/diameter_parse_pcap.git"
Issues = "https://github.com/bilotto/diameter_parse_pcap/issues"
Documentation = "https://github.com/bilotto/diameter_parse_pcap#readme"

[project.scripts]
diameter-parse-pcap = "diameter_parse_pcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyshark.*",
    "diameter.*",
    "diameter_telecom.*",
]
ignore_missing_imports = true
